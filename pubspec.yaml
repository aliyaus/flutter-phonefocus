name: phonefocus
description: "A new Flutter project."
publish_to: 'none'
version: 0.1.0

environment:
  sdk: ^3.10.0
  flutter: '>=3.47.5'

dependencies:
  flutter:
    sdk: flutter
  camera: ^0.12.0+1
  audioplayers: ^6.7.1
  sensors_plus: ^7.1.1
  hand_detection: ^4.3.1
  flutter_litert: ^3.9.2
  lottie: ^3.8.2
  face_detection_tflite: ^6.10.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/sounds/
    - assets/animations/

hooks:
  user_defines:
    dartcv4:
      ios:
        deployment_target: '15.0'
